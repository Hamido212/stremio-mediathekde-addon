# Mediathek DE – Stremio Add-on
#
# Ein einziger Container: Server + automatisches Update alle 6 Stunden.
# Erster Start: Import der Filmliste dauert ca. 1–3 Minuten.
#
#   docker compose up -d
#   docker compose logs -f
#
# Statt lokal zu bauen kann das fertige Image genutzt werden:
#   image: ghcr.io/hamido212/stremio-mediathekde-addon:latest

services:
  mediathek:
    build: .
    # image: ghcr.io/hamido212/stremio-mediathekde-addon:latest
    container_name: stremio-mediathek
    restart: unless-stopped
    ports:
      - "7005:7005"
    environment:
      # Öffentliche Adresse (wichtig hinter Reverse-Proxy/HTTPS), z.B. https://mediathek.example.de
      - BASE_URL=${BASE_URL:-}
      - UPDATE_INTERVAL_HOURS=${UPDATE_INTERVAL_HOURS:-6}
      - DONATION_URL=${DONATION_URL:-}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Benutzer, unter dem der Server läuft (Synology: id deines Benutzers, z.B. 1026:100)
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./data:/app/data
